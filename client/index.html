<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ruudjuffermans admin</title>
    <script>
      // Resolve the theme before first paint to avoid a flash: the stored
      // preference (src/theme.ts, key admin.theme) wins over the OS scheme.
      (function () {
        try {
          var pref = localStorage.getItem('admin.theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          /* default to the light tokens */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
